[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-server"
version = "0.1.0"
description = "Local Flask server for multilingual embeddings (Horizon-Labs/multilingual-embedding-small)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface_hub>=0.27",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "waitress>=3.0",
]

[tool.setuptools]
packages = ["embedding_server"]
py-modules = ["app"]

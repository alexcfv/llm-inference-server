# Model
model:
  id: Horizon-Labs/multilingual-embedding-small
  # Local path to model_quantized.onnx; null — download from HF Hub
  path: null
  # Max tokens per text (model limit)
  max_length: 512
  # Batch size for ONNX inference
  inference_batch_size: 32

# HTTP server
server:
  host: 0.0.0.0
  port: 8080
  # Threads for ONNX Runtime and waitress; null — 4
  threads: null
  # Max texts per HTTP request
  max_batch_size: 128
